; ---------------------------------------------------------------------------
;  Smart Power Plug Wattage Monitor - live wattage from an MQTT power plug
;  Setup: right-click > Edit settings
;  Keep this file ASCII-only: Rainmeter reads non-ASCII .ini text only
;  from UTF-16 files.
; ---------------------------------------------------------------------------

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
ContextTitle=Edit settings
ContextAction=["#@#Settings.inc"]
ContextTitle2=Refresh
ContextAction2=[!Refresh]

[Metadata]
Name=rainmeter-mqtt-power
Author=Dzhay
Information=A skin for showing wattage usage from your smart power plug on your desktop. Set the MQTT broker and topic under right-click > Edit settings.
License=GNU GPLv3
Version=1.0

[Variables]
; Defaults - overridden by Settings.inc below.
MqttServer=
MqttTopic=
MqttUser=
MqttPassword=

@IncludeSettings=#@#Settings.inc
@IncludeDefaults=#@#Variables.inc

; ---------------------------------------------------------------------------
;  Measures
; ---------------------------------------------------------------------------

; MQTT server connection
[mqttServer]
Measure=Plugin
Plugin=MqttClient
Server=#MqttServer#
Username=#MqttUser#
Password=#MqttPassword#
OnMessage=[!UpdateMeasure "powerImport"][!UpdateMeasure "powerParser"][!UpdateMeter "meterPower"][!UpdateMeter "MeterBackground"][!Redraw]

; MQTT data subscription
[powerImport]
Measure=Plugin
Plugin=MqttClient
ParentName=mqttServer
Topic=#MqttTopic#

; Lua script to extract power from JSON
[powerParser]
Measure=Script
ScriptFile=#@#Scripts\Power.lua
UpdateDivider=1
DynamicVariables=1

; Reloads the skin when Settings.inc is saved.
[measureSettingsWatch]
Measure=Script
ScriptFile=#@#Scripts\Watch.lua
UpdateDivider=2

; ---------------------------------------------------------------------------
;  Meters
; ---------------------------------------------------------------------------

; Sized to the value meter below, so the card hugs the number.
[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,([meterPower:W]+#PaddingX#*2),#SkinHeight#,8 | Fill Color #ColorBackground# | StrokeWidth 0
DynamicVariables=1

[meterPower]
Meter=String
MeasureName=powerParser
X=#PaddingX#
Y=#PaddingY#
FontFace=#FontFaceValue#
FontSize=23
FontColor=#ColorText#
AntiAlias=1
Text=%1 W
